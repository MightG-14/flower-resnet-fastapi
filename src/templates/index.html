<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>花卉分类</title>
    <style>
        body {width:600px;margin:40px auto;font-family:system-ui;}
        .box {border:1px solid #ccc;padding:20px;border-radius:8px;}
        #result {margin-top:20px;font-size:18px;color:#222;}
    </style>
</head>
<body>
    <div class="box">
        <h3>花卉图片识别</h3>
        <input type="file" id="imgFile" accept="image/*">
        <button onclick="upload()">提交识别</button>
        <div id="result"></div>
    </div>

    <script>
        async function upload(){
            const file = document.getElementById("imgFile").files[0];
            if(!file){alert("请选择图片");return;}
            const formData = new FormData();
            formData.append("file", file);
            const res = await fetch("/predict", {method:"POST", body:formData});
            const data = await res.json();
            document.getElementById("result").innerHTML = `
                <p>识别类别：${data.class_name}</p>
                <p>类别编号：${data.class_id}</p>
                <p>置信度：${data.confidence}</p>
            `
        }
    </script>
</body>
</html>
